<!--
  This file does three things so far:
    1. Implements GFM alert support
    2. Reverts code blocks to look how they used to
       - the new darker style they added looks awful
    3. Adds a copy button to md tables, to copy as JSON5
-->
<style>
/* code block patches (reverts code blocks to look like how they used to in ~2022, since it looks better */
:root {
  --code-bg: #31343f;  /* thank you wayback machine. Thank you, thank you, thank you */
  --code-border: #44434d;
  --code-text: #dee2f7;
}

:not(pre, figure) > code {
  padding: 0.2em 0.15em;
  font-weight: 400;
  background-color: var(--code-bg) !important;
  border: 1px solid var(--code-border) !important;
  border-radius: 4px;
}

.highlight,
pre.highlight,
div.highlighter-rouge pre.highlight {
  background-color: var(--code-bg) !important;
  color: var(--code-text) !important;
}

pre code {
  background: transparent !important;
  border: 0 !important;
}

/* This CSS is to add GFM alerts in case you couldn't tell :p */
.markdown-alert {
  padding: 0.5em 1em;
  margin-bottom: 1em;
  border-left: 0.25em solid;
  border-radius: 4px;
  background-color: transparent;
}

.markdown-alert-title {
  display: flex;
  align-items: center;
  font-weight: 600;
  margin-bottom: 0.5em;
  margin-top: 0;
}

.markdown-alert-title svg {
  margin-right: 0.5em;
  flex-shrink: 0;
}

/* light mode is the base */
.markdown-alert-note {
  border-color: #0969da;
}
.markdown-alert-note .markdown-alert-title { color: #0969da; }

.markdown-alert-tip {
  border-color: #1a7f37;
}
.markdown-alert-tip .markdown-alert-title { color: #1a7f37; }

.markdown-alert-important {
  border-color: #8250df;
}
.markdown-alert-important .markdown-alert-title { color: #8250df; }

.markdown-alert-warning {
  border-color: #966600;
}
.markdown-alert-warning .markdown-alert-title { color: #c69026; }

.markdown-alert-caution {
  border-color: #cf222e;
}
.markdown-alert-caution .markdown-alert-title { color: #cf222e; }

/* make it look good when dark mode is chosen */
@media (prefers-color-scheme: dark) {
  .markdown-alert-note {
    border-color: #1f6feb;
  }
  .markdown-alert-note .markdown-alert-title { color: #4493f8; }
  
  .markdown-alert-tip {
    border-color: #238636;
  }
  .markdown-alert-tip .markdown-alert-title { color: #3fb950; }
  
  .markdown-alert-important {
    border-color: #8957e5;
  }
  .markdown-alert-important .markdown-alert-title { color: #a371f7; }
  
  .markdown-alert-warning {
    border-color: #9e6a03;
  }
  .markdown-alert-warning .markdown-alert-title { color: #d29922; }
  
  .markdown-alert-caution {
    border-color: #da3633;
  }
  .markdown-alert-caution .markdown-alert-title { color: #f85149; }
}
  
.table-json5-wrapper {
  position: relative;
}

.table-json5-copy-btn {
  position: absolute;
  top: 0.5em;
  right: 0.5em;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2em;
  height: 2em;
  padding: 0;
  border: 1px solid var(--code-border, #44434d);
  border-radius: 4px;
  background-color: var(--code-bg, #31343f);
  color: var(--code-text, #dee2f7);
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s ease-in-out;
}

.table-json5-wrapper:hover .table-json5-copy-btn,
.table-json5-copy-btn:focus-visible {
  opacity: 1;
}

.table-json5-copy-btn .copy-icon {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.table-json5-copy-btn[data-copied="true"] {
  color: #3fb950;
  border-color: #3fb950;
}

/* hides the $key directive so we dont see $key in the rendered HTML (but we still keep it as thats the simplest solution for the code to still know about it :p) */
.table-json5-key-prefix {
  display: none;
}
</style>
<script>
/* GFM Alert transformation script yay! */
document.addEventListener('DOMContentLoaded', function() {
  const alertIcons = {
    note: '<svg class="octicon octicon-info mr-2" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>',
    tip: '<svg class="octicon octicon-light-bulb mr-2" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.223.264.47.556.673.848.284.411.537.896.621 1.49a.75.75 0 0 1-1.484.211c-.04-.282-.163-.547-.37-.847a8.456 8.456 0 0 0-.542-.68c-.084-.1-.173-.205-.268-.32C3.201 7.75 2.5 6.766 2.5 5.25 2.5 2.31 4.863 0 8 0s5.5 2.31 5.5 5.25c0 1.516-.701 2.5-1.328 3.259-.095.115-.184.22-.268.319-.207.245-.383.453-.541.681-.208.3-.33.565-.37.847a.751.751 0 0 1-1.485-.212c.084-.593.337-1.078.621-1.489.203-.292.45-.584.673-.848.075-.088.147-.173.213-.253.561-.679.985-1.32.985-2.304 0-2.06-1.637-3.75-4-3.75ZM5.75 12h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1 0-1.5ZM6 15.25a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1-.75-.75Z"></path></svg>',
    important: '<svg class="octicon octicon-report mr-2" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H8.06l-2.573 2.573A1.458 1.458 0 0 1 3 14.543V13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .138.112.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h6.5a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25Zm7 2.25v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 9a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>',
    warning: '<svg class="octicon octicon-alert mr-2" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>',
    caution: '<svg class="octicon octicon-stop mr-2" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.14.22.331.22.53v6a.749.749 0 0 1-.22.53l-4.25 4.25A.749.749 0 0 1 11 16H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>'
  };

  const alertTitles = {
    note: 'Note',
    tip: 'Tip',
    important: 'Important',
    warning: 'Warning',
    caution: 'Caution'
  };

  document.querySelectorAll('blockquote').forEach(function(blockquote) {
    const firstChild = blockquote.firstElementChild;
    if (!firstChild || firstChild.tagName !== 'P') return;

    const text = firstChild.textContent.trim();
    const match = text.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i);

    if (match) {
      const alertType = match[1].toLowerCase();
      const alertDiv = document.createElement('div');
      alertDiv.className = `markdown-alert markdown-alert-${alertType}`;
      const titleP = document.createElement('p');
      titleP.className = 'markdown-alert-title';
      titleP.innerHTML = `${alertIcons[alertType]}${alertTitles[alertType]}`;
      alertDiv.appendChild(titleP);

      firstChild.innerHTML = firstChild.innerHTML.replace(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(<br\s*\/?>)?\s*/i, '');
      if (!firstChild.textContent.trim()) firstChild.remove();
    
      /* we need to move all remaining children to the alert div */
      while (blockquote.firstChild) alertDiv.appendChild(blockquote.firstChild);
      blockquote.parentNode.replaceChild(alertDiv, blockquote); /* finally, replace the blockquote with the alert div */
    }
  });
});
  
/*
 * Parses a <table> and autodetects col type
 * returning good ol' JSON5
 * because of how I want things to be serialised
 * I didnt use a lib for the JSON5 serialisation
*/
class JSON5Table {
  static #HEX_BARE_RE = /^0x([0-9A-Fa-f]+)$/;
  static #HEX_PAIR_RE = /^0x([0-9A-Fa-f]+)\s*\(0x([0-9A-Fa-f]+)\)$/;
  static #BOOL_RE = /^(true|false)$/i;
  static #FLOAT_RE = /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/;
  static #SPECIAL_FLOAT_RE = /^(NaN|-?Infinity)$/;
  static #BARE_KEY_RE = /^[A-Za-z_$][A-Za-z0-9_$]*$/;
  static #BR_RE = /<br\s*\/?>|<\/br>/gi;
  static #INLINE_CODE_RE = /<code class="language-plaintext highlighter-rouge">(.*?)<\/code>/g;
  static #KEY_PREFIX_RE = /^\$key/;
  static #MAX_U32 = 0xFFFFFFFF;

  /* runtime generated because of the stupid build process */
  static #FIELD_INDENT = ' '.repeat(4);
  static #BRACE_INDENT = ' '.repeat(2);

  /* the entry point, <table> -> JSON5, as the explanation above already tells you :p */
  static serialize(table) {
    const rawHeaders = this.#extractRawHeaders(table);
    if (rawHeaders.length === 0) return null;

    const grid = this.#extractGrid(table, rawHeaders.length);
    if (grid.length === 0) return null;

    /*
     * if there's EXACTLY one $key column, we instead of an array of row-objects
     * use a single object keyed by that column's values
     * 2+ is ofc not correct, so we just strip and ignore
     * i think this is a pretty useful mechanism, still keeps everything automatic
     * but theres one manual trick (which doesn't affect rendering), to make the output
     * as clean as if it was manual, in the cases where the default is the wrong shape :3
     */
    const keyPrefixed = rawHeaders.map(h => this.#KEY_PREFIX_RE.test(h));
    const keyCol = keyPrefixed.filter(Boolean).length === 1 ? keyPrefixed.indexOf(true) : -1;

    const used = new Set();
    const headers = rawHeaders
      .map(h => h.replace(this.#KEY_PREFIX_RE, '').trim())
      .map(name => name.charAt(0).toLowerCase() + name.slice(1)) /* id might look weird, same for something like _Abc not being lowercased but it's fine for simplicity */
      .map(name => this.#dedupeHeader(name, used));

    const columnTypes = headers.map((_, col) => this.#inferColumnType(grid, col));

    if (keyCol === -1) return this.#renderArray(headers, columnTypes, grid);
    return this.#renderKeyed(headers, columnTypes, grid, keyCol);
  }

  static #isNullToken(trimmed) {
    return trimmed === '-' || trimmed.toLowerCase() === 'n/a';
  }

  /* public so TableCopyButtons can know about it */
  static hasKeyPrefix(headerText) {
    return this.#KEY_PREFIX_RE.test(headerText);
  }

  static #classifyCell(trimmed) {
    const pairMatch = trimmed.match(this.#HEX_PAIR_RE);
    if (pairMatch) {
      const [, a, b] = pairMatch;
      if (parseInt(a, 16) !== parseInt(b, 16)) return { kind: 'string', value: trimmed };
      return this.#classifyId(parseInt(a, 16), trimmed);
    }

    const bareMatch = trimmed.match(this.#HEX_BARE_RE);
    if (bareMatch) return this.#classifyId(parseInt(bareMatch[1], 16), trimmed);
    if (this.#BOOL_RE.test(trimmed)) return { kind: 'bool', value: trimmed.toLowerCase() === 'true' };

    if (this.#SPECIAL_FLOAT_RE.test(trimmed)) {
      const value = trimmed === 'NaN' ? NaN : trimmed === '-Infinity' ? -Infinity : Infinity;
      return { kind: 'float', value };
    }

    if (this.#FLOAT_RE.test(trimmed)) return { kind: 'float', value: parseFloat(trimmed) };
    return { kind: 'string', value: trimmed };
  }

  /*
   * In the Yo-kai Watch modding community, we use IDs to refer to CRC-32 hashes (they are extremely prevalent in Level5's engines)
   * so anything outside u32 range is malformed source data, although may in some case, be intentional.
   * so we degrade to string to maintain usability, and alert, so the specific situation can be evaluated
   * to see if we lift this restriction (and replace >>> 0, with higher range counterparts) or change that specific instance
   * also note that we don't throw here because it'd be messy and it's not fatal, so we just tell the user, so we can get a bug report, and fallback
   */
  static #classifyId(value, trimmed) {
    if (value > this.#MAX_U32) {
      alert("This table has an Invalid ID, hence IDs will be treated as strings. Please contact @n123original on discord to resolve this issue, or make an Issue on the site's respository.");
      return { kind: 'string', value: trimmed };
    }
    return { kind: 'id', value };
  }

  static #formatFloat(value) {
    if (Number.isNaN(value)) return 'NaN';
    if (value === Infinity) return 'Infinity';
    if (value === -Infinity) return '-Infinity';
    return String(value);
  }

  static #formatString(raw) {
    const withNewlines = raw.replace(this.#BR_RE, '\n');
    return "'" + (withNewlines
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/\n/g, '\\n')
      .replace(/\r/g, '\\r')
      .replace(/\t/g, '\\t')) + "'";
  }

  static #formatKey(key) {
    return this.#BARE_KEY_RE.test(key) ? key : `'${key.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}'`;
  }

  /*
   * i should explain this one
   * it appends 2 to the key, if still not unique
   * tries appending 3 instead, and loops until it creates a unique key
   * i designed it this way so that tables that have 2+ columns with the same name can still be copied
   * without a stupid format like [key, value]
  */
  static #dedupeHeader(name, used) {
    let candidate = name;
    let suffix = 2;
    while (used.has(candidate)) {
      candidate = `${name}${suffix}`;
      suffix += 1;
    }
    used.add(candidate);
    return candidate;
  }

  static #extractRawHeaders(table) {
    return Array.from(table.querySelectorAll('thead tr th')).map(th => th.textContent.trim());
  }

  static #extractGrid(table, colCount) {
    return Array.from(table.querySelectorAll('tbody tr')).map(row => {
      const cells = Array.from(row.querySelectorAll('td'));
      return Array.from({ length: colCount }, (_, i) => (cells[i] ? this.#stripInlineCode(cells[i].innerHTML.trim()) : null));
    });
  }

  /* <code class="language-plaintext highlighter-rouge">foo</code> -> foo for obvious reasons, md formatting should be stripped, only backticks rn because I'm lazy and that's whats used */
  static #stripInlineCode(raw) {
    return raw.replace(this.#INLINE_CODE_RE, '$1');
  }

  /* empty/null cells ofc dont count towards type */
  static #votingValue(raw) {
    if (raw === null) return null;
    const trimmed = raw.replace(this.#BR_RE, ' ').trim();
    if (trimmed === '' || this.#isNullToken(trimmed)) return null;
    return trimmed;
  }

  /*
   * a column's type is detected as whatever every (eligible) cell agrees on
   * if there's no consensus it must be a string (or at the minimum its the safe output)
   */
  static #inferColumnType(grid, col) {
    let type = null;
    for (const row of grid) {
      const trimmed = this.#votingValue(row[col]);
      if (trimmed === null) continue;
      const { kind } = this.#classifyCell(trimmed);
      if (type === null) type = kind;
      else if (type !== kind) return 'string';
    }
    return type ?? 'string';
  }

  static #formatCell(raw, colType) {
    if (raw === null) return 'null';
    const trimmed = raw.replace(this.#BR_RE, ' ').trim();
    if (trimmed === '') return "''";
    if (this.#isNullToken(trimmed)) return 'null';

    switch (colType) {
      case 'id': return `0x${(this.#classifyCell(trimmed).value >>> 0).toString(16).toUpperCase()}`;
      case 'bool': return this.#classifyCell(trimmed).value ? 'true' : 'false';
      case 'float': return this.#formatFloat(this.#classifyCell(trimmed).value);
      default: return this.#formatString(raw);
    }
  }

  static #renderArray(headers, columnTypes, grid) {
    const rows = grid.map(rowValues => {
      const fields = headers.map((key, col) => `${this.#FIELD_INDENT}${this.#formatKey(key)}: ${this.#formatCell(rowValues[col], columnTypes[col])}`);
      return `${this.#BRACE_INDENT}{\n${fields.join(',\n')}\n${this.#BRACE_INDENT}}`;
    });
    return `[\n${rows.join(',\n')}\n]`;
  }

  /*
   * collapses the table into a single object keyed by the $key column entries
   * != 1 aka 0 or 2+ does not exhibit this behaviour, as that'd be invalid
   * if theres a key collision, we throw: unlike the ID case above, there's no sensible
   * partial output here, the whole render is compromised, so abort rather than degrade
   */
  static #renderKeyed(headers, columnTypes, grid, keyCol) {
    const otherCols = headers.map((_, col) => col).filter(col => col !== keyCol);
    const seenKeys = new Set();
    const entries = [];
    const keyColType = columnTypes[keyCol];
    
    for (const rowValues of grid) {
      const rawKey = rowValues[keyCol];
      const keyText = rawKey === null ? '' : rawKey.replace(this.#BR_RE, ' ').trim();
      if (this.#isNullToken(keyText) || keyText === '') continue;
      const normalizedKey = keyColType === 'id' ? `0x${(this.#classifyCell(keyText).value >>> 0).toString(16).toUpperCase()}` : keyText;
      
      if (seenKeys.has(normalizedKey))
        throw new Error("This table cannot be copied as it has a conflicting key. Please contact @n123original on discord to resolve this issue, or make an Issue on the site's respository.");
      seenKeys.add(normalizedKey);

      const formattedKey = this.#formatKey(normalizedKey);
      const value = otherCols.length === 1 ? this.#formatCell(rowValues[otherCols[0]], columnTypes[otherCols[0]]) : this.#renderKeyedValueObject(headers, columnTypes, rowValues, otherCols);
      entries.push(`${this.#FIELD_INDENT}${formattedKey}: ${value}`);
    }

    return `{\n${entries.join(',\n')}\n}`;
  }

  static #renderKeyedValueObject(headers, columnTypes, rowValues, otherCols) {
    const fields = otherCols.map(col => `${this.#FIELD_INDENT}${this.#FIELD_INDENT}${this.#formatKey(headers[col])}: ${this.#formatCell(rowValues[col], columnTypes[col])}`);
    return `{\n${fields.join(',\n')}\n${this.#FIELD_INDENT}}`;
  }
}
  
/* adds the copy button to every table */
const TableCopyButtons = {
  isEligible(table) {
    return !table.closest('.table-json5-wrapper') && table.querySelector('thead tr th') && table.querySelector('tbody tr');
  },

  wrap(table) {
    this.hideKeyPrefixes(table);

    const wrapper = document.createElement('div');
    wrapper.className = 'table-json5-wrapper';
    table.parentNode.insertBefore(wrapper, table);
    wrapper.appendChild(table);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'table-json5-copy-btn';
    btn.setAttribute('aria-label', 'Copy table as JSON5');
    btn.innerHTML = '<svg viewBox="0 0 24 24" class="copy-icon"><use xlink:href="#svg-copy"></use></svg>';
    btn.addEventListener('click', () => this.handleCopyClick(btn, table));
    wrapper.appendChild(btn);
  },

  /* 
   * make $key invisible so it's still there (and thus is in the textContent for the JSON5 serialiser to read)
   * but the user won't see it in the rendered output, for obvious reasons
   */
  hideKeyPrefixes(table) {
    table.querySelectorAll('thead tr th').forEach(th => {
      if (!JSON5Table.hasKeyPrefix(th.textContent.trim())) return;
      if (th.querySelector('.table-json5-key-prefix')) return; /* already wired */

      const text = th.textContent;
      const prefixEnd = text.indexOf('$key') + '$key'.length;
      const span = document.createElement('span');
      span.className = 'table-json5-key-prefix';
      span.textContent = text.slice(0, prefixEnd);

      th.textContent = '';
      th.appendChild(span);
      th.appendChild(document.createTextNode(text.slice(prefixEnd)));
    });
  },

  handleCopyClick(btn, table) {
    let json5;
    try {
      json5 = JSON5Table.serialize(table);
    } catch (err) {
      alert(err.message);
      return;
    }
    if (json5 === null) return;

    navigator.clipboard.writeText(json5)
      .then(() => {
        btn.setAttribute('data-copied', 'true');
        btn.setAttribute('aria-label', 'Copied!');
        btn.innerHTML = '<svg viewBox="0 0 24 24" class="copy-icon"><use xlink:href="#svg-copied"></use></svg>';

        setTimeout(() => {
          btn.removeAttribute('data-copied');
          btn.setAttribute('aria-label', 'Copy table as JSON5');
          btn.innerHTML = '<svg viewBox="0 0 24 24" class="copy-icon"><use xlink:href="#svg-copy"></use></svg>';
        }, 2000);
      })
      .catch(err => console.error('Failed to copy table as JSON5:', err, "\nPlease tell me if you see this :p"));
  },

  init() {
    const content = document.querySelector('.main-content') ?? document.body;
    content.querySelectorAll('table').forEach(table => {
      if (this.isEligible(table)) this.wrap(table);
    });
  },
};

document.addEventListener('DOMContentLoaded', () => TableCopyButtons.init());
</script>
